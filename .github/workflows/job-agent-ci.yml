name: Job Agent CI

on:
  push:
    paths:
      - "job_agent/**"
      - "tests/**"
      - "dashboard.py"
      - "requirements.txt"
      - ".github/workflows/job-agent-ci.yml"
  pull_request:
    paths:
      - "job_agent/**"
      - "tests/**"
      - "dashboard.py"
      - "requirements.txt"
      - ".github/workflows/job-agent-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
